name: Build and Release Handheld APK

on:
  push:
    branches: [main]
    # The APK is built from config.json, src-tauri/ and ui/. A documentation or
    # front-door push changes nothing the device runs, so it neither spends runner
    # time nor cuts a release.
    paths-ignore:
      - '**.md'
      - 'index.html'
      - 'wizard.html'
      - 'demo.html'
      - '.nojekyll'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      config:
        description: "Which profile to build"
        type: choice
        options:
          - production
          - demo
        default: production

# Creating the release and its tag is the only write this job needs.
permissions:
  contents: write

concurrency:
  # A demo dispatch must not cancel the production build for the same commit.
  group: release-${{ github.ref }}-${{ inputs.config || 'production' }}
  cancel-in-progress: true

env:
  # Pinned so a runner image change cannot silently move the build.
  NDK_VERSION: 27.3.13750724
  ANDROID_PLATFORM: platforms;android-37.0
  ANDROID_BUILD_TOOLS: build-tools;37.0.0
  RUST_TOOLCHAIN: 1.95.0
  TAURI_CLI: 2.12.4

jobs:
  build-apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Tags choose the next version and set the base of the generated release
          # notes. A shallow clone has neither, so it would republish a version
          # that already exists.
          fetch-depth: 0

      # The demo profile is the same code pointed at the template's own demo page.
      # Every copy keeps config.json untouched; the swap happens in this runner.
      - name: Use the demo configuration
        if: inputs.config == 'demo'
        run: cp config.demo.json config.json

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # The ubuntu runner already ships an Android SDK with cmdline-tools, and
      # android-actions/setup-android@v3 broke the job by running the long-removed
      # `sdkmanager tools` package. Install exactly the packages this build needs
      # instead of relying on a third-party setup action.
      - name: Install Android platform, build tools and NDK
        run: |
          set -euo pipefail
          echo "Using Android SDK at $ANDROID_HOME"
          test -d "$ANDROID_HOME"
          if ! command -v sdkmanager > /dev/null; then
            CMDLINE_TOOLS="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)"
            echo "$CMDLINE_TOOLS" >> "$GITHUB_PATH"
            export PATH="$CMDLINE_TOOLS:$PATH"
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "$ANDROID_PLATFORM" "$ANDROID_BUILD_TOOLS" "ndk;$NDK_VERSION" "platform-tools"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"
          test -d "$ANDROID_HOME/platforms/android-37.0"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi

      # No Rust cache on purpose. A cold Android build is about five minutes, a
      # maker builds rarely, and the cache key was repeatedly refused with
      # "Unable to reserve cache ... another job may be creating this cache" after
      # a cancelled run held the reservation. Fewer moving parts wins.
      - name: Install Tauri CLI
        run: npm install --global @tauri-apps/cli@${{ env.TAURI_CLI }}

      # A patch bump on the newest v* tag. A fresh copy of the template has no
      # tags at all, so its first build is v1.0.0. The version is written into the
      # two manifests Tauri reads and never committed back: the tag is the record,
      # and a push from CI would restart this job forever.
      - name: Stamp the next version
        run: |
          set -euo pipefail
          LAST="$(git tag --list 'v[0-9]*' --sort=-v:refname | head -1)"
          if [ -z "$LAST" ]; then
            NEXT="1.0.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST#v}"
            NEXT="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          python3 - "$NEXT" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          config = pathlib.Path("src-tauri/tauri.conf.json")
          config.write_text(
              re.sub(r'"version": "[^"]+"', f'"version": "{version}"',
                     config.read_text(), count=1)
          )
          cargo = pathlib.Path("src-tauri/Cargo.toml")
          cargo.write_text(
              re.sub(r'(?m)^version = "[^"]+"', f'version = "{version}"',
                     cargo.read_text(), count=1)
          )
          PY
          echo "Previous tag: ${LAST:-none, this is a fresh copy of the template}"
          echo "Release version: v$NEXT"
          echo "APP_VERSION=$NEXT" >> "$GITHUB_ENV"

      - name: Verify toolchain
        run: |
          java -version
          rustc --version
          tauri --version
          echo "NDK_HOME=$NDK_HOME"
          echo "APP_VERSION=$APP_VERSION"

      - name: Build release APK
        run: tauri android build --apk --target aarch64 --target armv7 --ci

      - name: Verify APK
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)"
          echo "APK: $APK"
          echo "Size: $(stat -c%s "$APK") bytes"
          test "$(stat -c%s "$APK")" -gt 2000000

          echo "--- signature ---"
          "$BT/apksigner" verify --verbose "$APK"

          echo "--- badging ---"
          BADGING="$("$BT/aapt2" dump badging "$APK")"
          echo "$BADGING" | grep -E "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:|^native-code:"
          # The tag and the APK it describes must never drift apart.
          echo "$BADGING" | grep -q "versionName='$APP_VERSION'" || {
            echo "APK versionName does not match the release version v$APP_VERSION"; exit 1; }

          echo "--- packaged payloads ---"
          unzip -l "$APK" | grep -E "classes\.dex|AndroidManifest\.xml|lib/(arm64-v8a|armeabi-v7a)/"
          for ABI in arm64-v8a armeabi-v7a; do
            unzip -l "$APK" | grep -Eq " lib/$ABI/[^/]+\.so$" || {
              echo "No native library packaged for $ABI"; exit 1; }
          done

          echo "--- config.json baked into the manifest ---"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -A2 "BarcodeReceiver"

          echo "--- the maker's config.json baked into the native library ---"
          unzip -p "$APK" lib/arm64-v8a/*.so > /tmp/libshell.so
          APP_NAME="$(python3 -c "import json;print(json.load(open('config.json'))['appName'])")"
          POWER_APP_URL="$(python3 -c "import json;print(json.load(open('config.json'))['powerAppUrl'])")"
          strings -a /tmp/libshell.so | grep -F "$POWER_APP_URL" > /dev/null
          strings -a /tmp/libshell.so | grep -F "$APP_NAME" > /dev/null
          echo "Embedded config found in libshell.so: $APP_NAME"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: PowerApps-Handheld-Release-APK
          path: src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
          if-no-files-found: error
          retention-days: 90

      # Only after the build and every check above have passed, and only from main.
      # A branch run, which is how a maker tests a config without touching their
      # default branch, builds and uploads but publishes nothing.
      #
      # The template repository itself publishes no numbered releases: its own
      # config.json is still the placeholder, so the APK would be useless. Copies
      # do not match this repository name and release normally.
      - name: Publish release
        if: >-
          github.ref == 'refs/heads/main'
          && inputs.config != 'demo'
          && github.repository != 'Spuds0588/PowerApps-Mobile-Handheld-Shell'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Re-running a job must not cut a second release for the same commit.
          if git tag --points-at "$GITHUB_SHA" | grep -q '^v[0-9]'; then
            echo "This commit is already released: $(git tag --points-at "$GITHUB_SHA" | tr '\n' ' ')"
            exit 0
          fi

          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)"
          NOTES="$(mktemp)"
          {
            echo "APK for the \`config.json\` in this tag. Signed with the committed development key."
            echo
            echo '```'
            echo "adb install -r app-universal-release.apk"
            echo '```'
            echo
            echo "| Built from | config.json |"
            echo "| --- | --- |"
            echo "| App name | $(python3 -c "import json;print(json.load(open('config.json'))['appName'])") |"
            echo "| Power App | $(python3 -c "import json;print(json.load(open('config.json'))['powerAppUrl'])") |"
            echo "| Scan action | \`$(python3 -c "import json;print(json.load(open('config.json'))['scanner']['intentAction'])")\` |"
          } > "$NOTES"

          gh release create "v$APP_VERSION" "$APK" \
            --title "v$APP_VERSION" \
            --notes-file "$NOTES" \
            --generate-notes \
            --target "$GITHUB_SHA"
          echo "Published $(gh release view "v$APP_VERSION" --json url --jq .url)"

      # One rolling pre-release for the demo profile, mirroring the sister
      # templates. Dispatching with config = demo rebuilds it in place.
      - name: Publish demo release
        if: github.ref == 'refs/heads/main' && inputs.config == 'demo'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="$(ls src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk)"
          cp "$APK" PowerApps-Handheld-Demo.apk
          NOTES="$(mktemp)"
          {
            echo "Prebuilt demo of PowerApps Mobile Handheld Shell. It opens a stand-in pick list on GitHub Pages, not a tenant:"
            echo
            echo "https://spuds0588.github.io/PowerApps-Mobile-Handheld-Shell/demo.html"
            echo
            echo "The demo profile is \`config.demo.json\`. Install it with:"
            echo
            echo '```'
            echo "adb install -r PowerApps-Handheld-Demo.apk"
            echo '```'
            echo
            echo "Signed with the committed development key, so Android warns on sideload. Built from \`$(git rev-parse --short HEAD)\`, workflow run $GITHUB_RUN_ID."
          } > "$NOTES"
          if gh release view demo-latest > /dev/null 2>&1; then
            gh release upload demo-latest PowerApps-Handheld-Demo.apk --clobber
            gh release edit demo-latest --title "Handheld demo APK" --notes-file "$NOTES"
          else
            gh release create demo-latest PowerApps-Handheld-Demo.apk \
              --title "Handheld demo APK" \
              --notes-file "$NOTES" \
              --prerelease \
              --target "$GITHUB_SHA"
          fi
          echo "Published $(gh release view demo-latest --json url --jq .url)"
